ر عالي","لأن AI يعالج على الجهاز فقط","لأنه يضيف رقمي على حقيقي","لأنه دفع QR"],correct:0,type:"متفوقين"},{id:157,lesson:3,lessonTitle:"الدرس 1-3",text:"فرصة وتحدي بنفس النقطة؟",options:["نظام التوصية فرصة يقترح ما يهمك بسرعة من بيانات سلوكك - تحدي يستخدم بياناتك الشخصية ويثير مخاوف الخصوصية","الترجمة فرصة فقط","الوجه تحدي فقط","الصوتي فرصة فقط"],correct:0,type:"متفوقين"},{id:158,lesson:3,lessonTitle:"الدرس 1-3",text:"حل: كيف تقلل تحيز نظام توصية يقترح محتوى متطرف فقط؟",options:["تنويع بيانات التدريب والتحقق من المخرجات والإشراف البشري وتطبيق مبادئ الأخلاق والشفافية","إرسال كل البيانات للسحابة","استخدام دفع QR","استخدام حوسبة طرفية فقط"],correct:0,type:"متفوقين"},{id:159,lesson:3,lessonTitle:"الدرس 1-3",text:"تمييز: ما الذي يبرع فيه vs ما يتطلب الحذر في حالة فتح الهاتف بالوجه؟",options:["يبرع في التعرف على الوجه في الصور - يتطلب حذر لأنه يتعامل مع معلومات شخصية وخصوصية ومسؤولية","يبرع في الأخلاق - يتطلب حذر في الصور","يبرع في المسؤولية - يتطلب حذر في الصوت","لا فرق"],correct:0,type:"متفوقين"},{id:160,lesson:3,lessonTitle:"الدرس 1-3",text:"عميق: هل الترجمة الآلية تحتاج حذر مثل التشخيص الطبي؟",options:["لا بنفس الدرجة - الترجمة خطأها أقل أثرا - التشخيص خطأه عالي الأثر ويحتاج تأكيد طبيب بشري ومسؤولية","كلاهما نفس الخطر","الترجمة أخطر","لا حذر لأي منهما"],correct:0,type:"متفوقين"},{id:161,lesson:3,lessonTitle:"الدرس 1-3",text:"أخلاقي: لماذا يثير استخدام بياناتك (ما تشاهده/تشتريه/تقوله) مخاوف؟",options:["لأنها معلومات شخصية وبيانات حساسة واستخدامها يحتاج موافقة وقرار من يقرر كيفية استخدامها وشفافية","لأنها حوسبة طرفية","لأنها واقع معزز","لأنها تجارة فقط"],correct:0,type:"متفوقين"},{id:162,lesson:3,lessonTitle:"الدرس 1-3",text:"تكامل: سيناريو يجمع الحياة اليومية والصناعة؟",options:["مزارع يستخدم مساعد صوتي (حياة يومية) لسؤال عن حالة الطقس + نظام يتنبأ بموعد الحصاد ويكشف الآفات (صناعة زراعية) + نظام يحسن مسارات التوصيل للمحصول (لوجستية)","سيناريو توصية فقط","سيناريو ترجمة فقط","سيناريو وجه فقط"],correct:0,type:"متفوقين"},{id:163,lesson:3,lessonTitle:"الدرس 1-3",text:'نقدي: لماذا قال الكتاب "الحكم البشري لا يزال ضروريا" ولم يقل "غير ضروري"؟',options:["لأن القرارات ذات البعد الأخلاقي والخصوصية والمسؤولية والقرارات عالية الأثر لا يمكن تركها لـ AI وحده","لأن AI يعالج على الجهاز","لأن AI يضيف رقمي","لأن AI يدفع QR"],correct:0,type:"متفوقين"},{id:164,lesson:3,lessonTitle:"الدرس 1-3",text:"أولويات: شركة عندها ميزانية محدودة - تستثمر في توصية فيديو أم تشخيص طبي مع إشراف بشري؟",options:["التوصية أسهل وأقل خطرا لكن التشخيص يحتاج استثمار أكبر في التحقق والإشراف البشري والمسؤولية لأنه عالي الأثر","التوصية تحتاج إشراف طبي","التشخيص لا يحتاج حذر","لا فرق"],correct:0,type:"متفوقين"},{id:165,lesson:3,lessonTitle:"الدرس 1-3",text:"ابتكاري: اقترح قاعدة واحدة لاستخدام التعرف على الوجه في مدرستك بأمان؟",options:["السماح به لفتح أجهزة المدرسة فقط مع موافقة أولياء الأمور وحماية خصوصية الصور وتحديد المسؤول وتأكيد بشري عند الرفض","استخدامه دون موافقة","استخدامه لنشر صور الطلاب","استخدامه بدون مسؤول"],correct:0,type:"متفوقين"},{id:166,lesson:4,lessonTitle:"الدرس 1-4: القضايا الأخلاقية للذكاء الاصطناعي",text:"ما هو السؤال الرئيسي للدرس 1-4؟ [ص25]",options:["ما القضايا الأخلاقية التي تنشأ مع انتشار الذكاء الاصطناعي، وما المبادئ التي ينبغي أن توجه كيفية استخدامنا له؟","كيف يعمل الذكاء التوليدي؟","ما هي الحوسبة الطرفية؟","ما هي أنظمة التوصية؟"],correct:0,type:"أساسي"},{id:167,lesson:4,lessonTitle:"الدرس 1-4",text:"ما الفكرة الأساسية للدرس؟ [ص26]",options:["إذا كانت بيانات التدريب متحيزة، يمكن للذكاء الاصطناعي أن يكرر هذا التحيز في أحكامه؛ واستخدام الذكاء الاصطناعي بمسؤولية يعني التحقق من التحيز، والقدرة على شرح القرارات، ومعرفة من هو المسؤول","الذكاء الاصطناعي لا يتحيز أبدا","بيانات التدريب لا تؤثر على المخرجات","لا حاجة للمسؤولية"],correct:0,type:"أساسي"},{id:168,lesson:4,lessonTitle:"الدرس 1-4",text:"ما تعريف التحيز الخوارزمي حسب كتابك؟ [ص26]",options:["نمط في مخرجات الذكاء الاصطناعي قد يؤدي إلى نتائج غير عادلة أو ضارة، وقد ينشأ من البيانات أو تصميم النظام أو طريقة استخدامه أو السياق البشري والاجتماعي","سرعة معالجة الحاسوب البطيئة","جمع بيانات السلوك عبر الإنترنت فقط","تقنية تتيح فهم سبب اتخاذ القرار"],correct:0,type:"أساسي"},{id:169,lesson:4,lessonTitle:"الدرس 1-4",text:"ما هي بيانات التدريب؟ [ص26]",options:["الأمثلة التي يتعلم منها نظام الذكاء الاصطناعي أنماطه قبل استخدامه؛ وكلما قل تمثيلها للواقع زاد احتمال تحيز مخرجاته","نظام يتنبأ بالتفضيلات من السلوك السابق","نظام يترجم النص تلقائيا","نظام يتعرف على الوجوه"],correct:0,type:"أساسي"},{id:170,lesson:4,lessonTitle:"الدرس 1-4",text:"[استكشف ص25] ذكاء تعرف على الوجه أكثر عرضة لإساءة التعرف على بعض المجموعات العرقية - ما السبب المتوقع؟",options:["بيانات تدريب غير ممثلة أو متحيزة أو بيانات غير كافية عن سمات معينة","سرعة معالجة بطيئة","تحسن سرعة الحوسبة","نظام توصية"],correct:0,type:"أساسي"},{id:171,lesson:4,lessonTitle:"الدرس 1-4",text:"ما هي أسباب التحيز الخوارزمي الرئيسية حسب الكتاب؟ [ص25-28]",options:["بيانات تدريب متحيزة، انعكاس نزعات تمييزية سابقة في البيانات، بيانات غير كافية عن سمات معينة، تصميم النظام وطريقة استخدامه","سرعة معالجة الحاسوب بطيئة فقط","تحسن سرعة الحوسبة فقط","نظام التوصية فقط"],correct:0,type:"أساسي"},{id:172,lesson:4,lessonTitle:"الدرس 1-4",text:"أي مما يلي ليس سببا مناسبا للتحيز الخوارزمي؟ [ص28 تدرب]",options:["سرعة معالجة الحاسوب بطيئة","بيانات التدريب متحيزة","انعكاس نزعات تمييزية سابقة في البيانات","هناك بيانات غير كافية عن سمات معينة"],correct:0,type:"أساسي"},{id:173,lesson:4,lessonTitle:"الدرس 1-4",text:"ما هي قضايا الخصوصية المرتبطة بالذكاء الاصطناعي؟ [ص26]",options:["المراقبة عبر تقنية التعرف على الوجه + الجمع الجماعي للبيانات الشخصية","إنشاء أعمال إبداعية فقط","تحسن سرعة الحوسبة فقط","نظام توصية فقط"],correct:0,type:"أساسي"},{id:174,lesson:4,lessonTitle:"الدرس 1-4",text:"[تدرب ص28] اختر كل ما يمثل قضايا خصوصية؟",options:["يتم التعرف على الأفراد وتتبعهم من خلال تقنية التعرف على الوجه + تجمع بيانات السلوك عبر الإنترنت وتحلل بكميات كبيرة","الذكاء الاصطناعي ينشئ أعمالا إبداعية","تتحسن سرعة حوسبة الذكاء الاصطناعي","سرعة المعالجة بطيئة"],correct:0,type:"أساسي"},{id:175,lesson:4,lessonTitle:"الدرس 1-4",text:"ما هو الذكاء الاصطناعي القابل للتفسير XAI؟ [ص26-27]",options:["تقنية تتيح للبشر فهم سبب اتخاذ الذكاء الاصطناعي حكما معينا، اختصارها XAI","نظام يتنبأ بالتفضيلات","نظام يترجم تلقائيا","نظام يتعرف على الوجه"],correct:0,type:"أساسي"},{id:176,lesson:4,lessonTitle:"الدرس 1-4",text:"ما هي مشكلة الصندوق الأسود؟ [من ص22 + ص26]",options:["عندما يكون من غير الواضح كيف توصل الذكاء الاصطناعي إلى حكمه","عندما تكون بيانات التدريب كافية","عندما تكون سرعة الحوسبة عالية","عندما يكون نظام التوصية دقيقا"],correct:0,type:"أساسي"},{id:177,lesson:4,lessonTitle:"الدرس 1-4",text:"ما هي المسؤولية Responsibility؟ [ص26-27]",options:["تحديد أدوار وواجبات الأطراف المرتبطة بتطوير النظام وتشغيله واستخدامه، مثل المطور والجهة المشغلة والمستخدم","عدم التمييز ظلما ضد أي شخص","إتاحة معلومات واضحة عن النظام","التعامل مع المعلومات الشخصية بشكل مناسب"],correct:0,type:"أساسي"},{id:178,lesson:4,lessonTitle:"الدرس 1-4",text:"ما هي المساءلة Accountability؟ [ص27]",options:["تحديد الجهات المسؤولة عن النظام وقراراته وآثاره، وإمكان محاسبتها وفق أدوارها","تقنية تتيح فهم سبب القرار","نظام توصية","ترجمة آلية"],correct:0,type:"أساسي"},{id:179,lesson:4,lessonTitle:"الدرس 1-4",text:"ما هي الشفافية Transparency؟ [ص27]",options:["إتاحة معلومات واضحة ومناسبة عن النظام واستخدامه وعملية اتخاذ القرار وحدوده","عدم التمييز ظلما","التعامل مع المعلومات الشخصية بشكل مناسب","تحديد الجهات المسؤولة"],correct:0,type:"أساسي"},{id:180,lesson:4,lessonTitle:"الدرس 1-4",text:"المبادئ الأربعة الأساسية لأخلاقيات الذكاء الاصطناعي التي يركز عليها الدرس؟ [ص27 جدول]",options:["العدالة، الشفافية، حماية الخصوصية، المساءلة","نظام التوصية، المساعد الصوتي، الترجمة، التعرف على الوجه","التجارة، التواصل، العمل عن بعد، الدفع","الحوسبة الطرفية، السحابية، الكمومية، AR"],correct:0,type:"أساسي"},{id:181,lesson:4,lessonTitle:"الدرس 1-4",text:"ما تعريف العدالة؟ [ص27-28]",options:["عدم التمييز ظلما ضد أي شخص أو مجموعة بعينها","إتاحة معلومات واضحة عن النظام","التعامل مع المعلومات الشخصية بشكل مناسب","تحديد الجهات المسؤولة"],correct:0,type:"أساسي"},{id:182,lesson:4,lessonTitle:"الدرس 1-4",text:"ما تعريف حماية الخصوصية؟",options:["التعامل مع المعلومات الشخصية بشكل مناسب وحماية الخصوصية","عدم التمييز ظلما","إتاحة معلومات واضحة","تحديد الجهات المسؤولة"],correct:0,type:"أساسي"},{id:183,lesson:4,lessonTitle:"الدرس 1-4",text:"[توقف وفكر ص27] عند استخدام التعرف على الوجه في الأماكن العامة قد تتحسن السلامة لكن تنشأ مخاوف خصوصية - ما المبدأ المرتبط؟",options:["حماية الخصوصية + العدالة + الشفافية","نظام التوصية فقط","الترجمة الآلية فقط","المساعد الصوتي فقط"],correct:0,type:"أساسي"},{id:184,lesson:4,lessonTitle:"الدرس 1-4",text:"[توقف وفكر ص28] إذا لم يستطع أحد شرح سبب رفض الذكاء لطلب توظيف شخص - هل هذا عادل؟ أي مبدأ مفقود؟",options:["غير عادل - المبدأ المفقود هو الشفافية و XAI والعدالة","عادل - لا مبدأ مفقود","عادل لأنه نظام توصية","عادل لأنه ترجمة آلية"],correct:0,type:"أساسي"},{id:185,lesson:4,lessonTitle:"الدرس 1-4",text:"[مثال محلول ص27] ضع ○ أو ×: التحيز الخوارزمي نمط في مخرجات الذكاء قد ينشأ من البيانات أو تصميم النظام وقد يؤدي لنتائج غير عادلة",options:["صح ○ - نص حرفي ص27","خطأ"],correct:0,type:"أساسي"},{id:186,lesson:4,lessonTitle:"الدرس 1-4",text:"حتى لو كانت عملية اتخاذ القرار غير واضحة، لا توجد مشكلة طالما النتيجة صحيحة",options:["صح","خطأ × - يصعب التحقق من صحة النتيجة واكتشاف التحيز"],correct:1,type:"أساسي"},{id:187,lesson:4,lessonTitle:"الدرس 1-4",text:"الذكاء الاصطناعي القابل للتفسير XAI هو تقنية تتيح للبشر فهم منطق الذكاء الاصطناعي",options:["صح","خطأ"],correct:0,type:"أساسي"},{id:188,lesson:4,lessonTitle:"الدرس 1-4",text:"عندما يتخذ الذكاء حكما خاطئا، فإن من هو المسؤول قد تم تحديده بوضوح بالفعل",options:["صح","خطأ × - تختلف الآراء حول المسؤولية باختلاف هل الشخص هو المطور أو المستخدم أو المشغل"],correct:1,type:"أساسي"},{id:189,lesson:4,lessonTitle:"الدرس 1-4",text:"طابق: 1-عدم التمييز 2-إظهار عملية اتخاذ القرار 3-التعامل مع المعلومات الشخصية 4-تحديد المسؤولين [ص27]",options:["1-العدالة 2-الشفافية 3-حماية الخصوصية 4-المساءلة","1-توصية 2-صوتي 3-ترجمة 4-وجه","1-تجارة 2-تواصل 3-دفع 4-تعلم","1-طرفية 2-سحابة 3-كمومية 4-AR"],correct:0,type:"أساسي"},{id:190,lesson:4,lessonTitle:"الدرس 1-4",text:"[سؤال على نمط الامتحان 6 درجات ص28] حلل كيف ينشأ التحيز وكيف تقلله؟",options:["سبب: بيانات تدريب متحيزة أو غير كافية + كيفية مساعدة مبدأي العدالة والشفافية في معالجته","سرعة معالجة بطيئة","تحسن سرعة الحوسبة","نظام توصية"],correct:0,type:"أساسي"},{id:191,lesson:4,lessonTitle:"الدرس 1-4",text:"ما المصطلح الذي يصف نمطا قد يؤدي لنتائج غير عادلة؟ [ص28 تدرب 1-1]",options:["التحيز الخوارزمي","الذكاء القابل للتفسير XAI","المسؤولية","الشفافية"],correct:0,type:"أساسي"},{id:192,lesson:4,lessonTitle:"الدرس 1-4",text:"ما المصطلح الخاص بالتقنية التي تتيح فهم سبب اتخاذ الحكم واختصارها 3 أحرف؟ [ص28 1-2]",options:["الذكاء الاصطناعي القابل للتفسير XAI","نظام التوصية","الترجمة الآلية","التعرف على الوجه"],correct:0,type:"أساسي"},{id:193,lesson:4,lessonTitle:"الدرس 1-4",text:"ما المبدأ الذي يقتضي عدم التمييز ظلما؟ [ص28 1-3]",options:["العدالة","الشفافية","حماية الخصوصية","المساءلة"],correct:0,type:"أساسي"},{id:194,lesson:4,lessonTitle:"الدرس 1-4",text:"ما المبدأ الذي يقتضي التعامل مع المعلومات الشخصية بشكل مناسب؟ [ص28 1-4]",options:["حماية الخصوصية","العدالة","الشفافية","المساءلة"],correct:0,type:"أساسي"},{id:195,lesson:4,lessonTitle:"الدرس 1-4",text:"[الخلاصة ص29] تذكر: إذا كانت بيانات التدريب متحيزة...",options:["يمكن للذكاء أن يكرر التحيز؛ واستخدام الذكاء بمسؤولية يعني التحقق من التحيز والقدرة على شرح القرارات ومعرفة من هو المسؤول","لا يكرر التحيز","لا حاجة للتحقق","لا حاجة للمسؤولية"],correct:0,type:"أساسي"},{id:196,lesson:4,lessonTitle:"الدرس 1-4",text:"صح/خطأ: المساءلة هي نفسها القدرة على شرح القرار",options:["صح","خطأ - المساءلة تحديد من يحاسب، الشرح وظيفة XAI"],correct:1,type:"أساسي"},{id:197,lesson:4,lessonTitle:"الدرس 1-4",text:"[تمارين ص30] املأ الفراغات: مع انتشار أنظمة AI برزت قضايا أخلاقية قد يظهر (1) عندما تؤدي البيانات أو التصميم لنتائج غير عادلة",options:["التحيز الخوارزمي","نظام التوصية","الترجمة الآلية","المساعد الصوتي"],correct:0,type:"أساسي"},{id:198,lesson:4,lessonTitle:"الدرس 1-4",text:"ولمعالجة مشكلة الصندوق الأسود تطور أساليب ت
